<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanilla WebApp Demo</title>
    <style>
        [x-cloak] { display: none !important; }
    </style>
  <script type="module" crossorigin src="/assets/main-DrubWtYM.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/main-DqQ3Iaft.css">
</head>
<body class="bg-gray-100 dark:bg-gray-900 min-h-screen transition-colors duration-200">
    <div x-data="spaApp"
         x-init="isLoggedIn = !!localStorage.getItem('token'); 
                 loadPage('menu-container', 'menu');
                 loadPage('login-register-container', 'login');
                 loadPage('view-container', 'landingpage');" 
         class="relative min-h-screen">
        
        <!-- Login  Registration Content -->
        <div x-show="!isLoggedIn" class="container mx-auto px-4 py-8">
            <div id="login-register-container"></div>
        </div>
        
        <!-- Logged In Content -->
        <div x-show="isLoggedIn" class="flex">
            <div id="menu-container"></div>
            
            <!-- Main Content Area -->
            <div class="flex-1 min-h-screen ml-16 transition-all duration-300 ease-in-out"
                 :class="{ 'ml-16': !menuController.sidebarOpen, 'ml-16 lg:ml-16 lg:group-hover:ml-64': menuController.sidebarOpen }">
                <div class="container mx-auto px-4 py-8 pt-16 lg:pt-8">
                    <div id="view-container" class="dark:text-gray-100"></div>
                </div>
            </div>
        </div>
        
    </div>
</body>
</html>
