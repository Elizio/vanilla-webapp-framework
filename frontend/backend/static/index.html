<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Vanilla WebApp Framework — lightweight Flask and Alpine.js starter for entrepreneur solutions.">
    <meta name="robots" content="noindex, nofollow">
    <title>Vanilla WebApp Demo</title>
    <style>
        [x-cloak] { display: none !important; }
    </style>
  <script type="module" crossorigin src="/assets/main-B2h5nVod.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/main-BWlCrsFQ.css">
</head>
<body class="bg-gray-100 dark:bg-gray-900 min-h-screen transition-colors duration-200">
    <div x-data="spaApp"
         class="relative min-h-screen">

        <!-- Public welcome page -->
        <div x-show="!isLoggedIn && !showLogin" id="public-container" class="min-h-screen"></div>

        <!-- Login / Registration -->
        <div x-show="!isLoggedIn && showLogin" class="container mx-auto px-4 py-8">
            <div id="login-register-container"></div>
        </div>

        <!-- Logged In Content -->
        <div x-show="isLoggedIn" class="flex">
            <div id="menu-container"></div>

            <!-- Main Content Area -->
            <div class="flex-1 min-h-screen ml-16 transition-all duration-300 ease-in-out"
                 :class="{ 'ml-16': !menuController.sidebarOpen, 'ml-16 lg:ml-16 lg:group-hover:ml-64': menuController.sidebarOpen }">
                <div class="container mx-auto px-4 py-8 pt-16 lg:pt-8">
                    <div id="view-container" class="dark:text-gray-100"></div>
                </div>
            </div>
        </div>

    </div>
</body>
</html>
