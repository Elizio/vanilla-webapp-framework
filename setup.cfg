# Ruff and mypy live in pyproject.toml. Keep pytest here so adding
# pyproject.toml does not steal pytest config (pytest ignores setup.cfg
# [tool:pytest] once [tool.pytest.ini_options] exists).

[tool:pytest]
testpaths = backend/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --cov=backend --cov-report=term-missing
