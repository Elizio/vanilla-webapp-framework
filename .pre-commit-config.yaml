# Pinned by commit SHA. CI runs the same tools via Makefile / job steps.
# .hbs templates are not linted (Biome has no Handlebars parser).
default_install_hook_types: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '^(vibe-prompts-examples/|docs/superpowers/|\.cursor/)|(\.hbs|\.md|\.mdc)$'
      - id: end-of-file-fixer
        exclude: '^(vibe-prompts-examples/|docs/superpowers/)|(\.md$)'
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 25bcf95026b96e2dd3c0aec3090c3d6ef6ca2e6c  # v0.17.3
    hooks:
      - id: ruff
      - id: ruff-format

  - repo: https://github.com/biomejs/pre-commit
    rev: eb45ebf3cb7c3a872b3ff0814883e8ab81fc451f  # v2.6.4
    hooks:
      - id: biome-check

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # v8.30.1
    hooks:
      - id: gitleaks

  # shellcheck-py ships the same 0.11.0 binary CI downloads; no Docker.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 745eface02aef23e168a8afb6b5737818efbea95  # v0.11.0.1
    hooks:
      - id: shellcheck
        args: ["--severity=warning"]
        files: '^(scripts/.*\.sh|docker-entrypoint\.sh)$'
