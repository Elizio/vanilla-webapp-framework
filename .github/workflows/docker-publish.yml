name: Build and Publish Docker Image

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: elizio/vanilla-webapp-framework

jobs:
  ci:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build-and-push:
    runs-on: ubuntu-latest
    needs: [ci]
    if: "!cancelled() && (github.event_name != 'push' || needs.ci.result == 'success')"
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
          labels: |
            org.opencontainers.image.source=${{ github.event.repository.html_url }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_BASE_PATH=/vanilla-webapp-framework/
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image has no development tools
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}"
          if ! docker image inspect "$IMAGE" >/dev/null 2>&1; then
            docker pull "$IMAGE"
          fi
          output="$(docker run --rm --entrypoint sh "$IMAGE" -c 'pip show pytest pytest-cov coverage mypy black flake8 ruff pre-commit' 2>&1 || true)"
          if printf '%s\n' "$output" | grep -q '^Name:'; then
            echo "::error::Development tools found in production image"
            printf '%s\n' "$output"
            exit 1
          fi
          echo "No development tools found in image"

      - name: Verify image runs as UID 10001
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}"
          if ! docker image inspect "$IMAGE" >/dev/null 2>&1; then
            docker pull "$IMAGE"
          fi
          uid="$(docker run --rm "$IMAGE" id -u)"
          if [ "$uid" != "10001" ]; then
            echo "::error::Expected container UID 10001, got $uid"
            exit 1
          fi
          if ! docker run --rm "$IMAGE" sh -c 'test ! -w /app/backend'; then
            echo "::error::/app/backend must not be writable by the runtime user"
            exit 1
          fi
          echo "Container runs as UID 10001 with read-only /app/backend"

  deploy:
    runs-on: ubuntu-latest
    needs: [ci, build-and-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
    concurrency:
      group: deploy-dsfor
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}

      - name: Deploy to Hostinger VPS
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
          VM_ID: 1136636
          PROJECT_NAME: dsfor
          NEW_IMAGE: ghcr.io/elizio/vanilla-webapp-framework:sha-${{ github.sha }}
          APP_URL: https://dsfor.fun/vanilla-webapp-framework
        run: bash scripts/deploy-hostinger.sh
