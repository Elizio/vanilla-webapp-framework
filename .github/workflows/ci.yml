name: CI

on:
  workflow_call:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop, master]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      APP_PROFILE: testing
      FLASK_SECRET: test-flask-secret-key
      JWT_SECRET: test-jwt-secret-key
      DATABASE_URI: "sqlite:///:memory:"
      PROJECT_FOLDER: /tmp/vanilla-webapp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install -e . --no-deps
      - name: Verify pinned versions match requirements.txt
        run: make check-pins
      - name: Run pip-audit on runtime dependencies
        run: make audit-python
      - name: Lint and typecheck Python
        run: make lint-python
      - name: Prove Ruff and mypy fail on bad input
        run: make prove-ruff-fail prove-mypy-fail
      - name: Check Alembic model/migration drift
        run: make migrations-check
      - name: Run backend tests
        run: make test-backend

  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - name: Run npm audit on production dependencies
        run: make audit-frontend
      - name: Lint frontend JS and JSON
        run: make lint-frontend
      - name: Prove Biome fails on bad input
        run: make prove-biome-fail
      - name: Build frontend
        run: make build-frontend
      - name: Run frontend tests with coverage floor
        run: make test-frontend

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so `gitleaks detect` scans every commit, not just the
          # PR tip (default fetch-depth: 1).
          fetch-depth: 0
      - name: Install pinned shellcheck, actionlint, and gitleaks
        run: ./scripts/install-lint-tools.sh
      - name: Run shellcheck, actionlint, and gitleaks
        run: make lint-shell
      - name: Prove gitleaks fails on a planted secret
        run: make prove-gitleaks-fail
