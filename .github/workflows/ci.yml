name: CI

on:
  workflow_call:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop, master]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      APP_PROFILE: testing
      FLASK_SECRET: test-flask-secret-key
      JWT_SECRET: test-jwt-secret-key
      DATABASE_URI: "sqlite:///:memory:"
      PROJECT_FOLDER: /tmp/vanilla-webapp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install -e . --no-deps
      - name: Verify pinned versions match requirements.txt
        run: python scripts/check_pins.py
      - name: Run pip-audit on runtime dependencies
        run: pip-audit -r requirements.txt
      - run: flake8 backend
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - name: Run npm audit on production dependencies
        run: cd frontend && npm audit --omit=dev --audit-level=high
      - run: cd frontend && npm run build
      - run: test -f backend/static/index.html
      - run: cd frontend && npm run test

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SHELLCHECK_VERSION: "0.11.0"
      SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install pinned shellcheck and actionlint
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          curl -fsSL -o "$tmp/shellcheck.tar.xz" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  $tmp/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf "$tmp/shellcheck.tar.xz" -C "$tmp"
          sudo install -m 0755 \
            "$tmp/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" \
            /usr/local/bin/shellcheck
          curl -fsSL -o "$tmp/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$tmp/actionlint.tar.gz" -C "$tmp" actionlint
          sudo install -m 0755 "$tmp/actionlint" /usr/local/bin/actionlint
          shellcheck --version
          actionlint -version
      - name: Run shellcheck
        run: shellcheck scripts/*.sh docker-entrypoint.sh
      - name: Run actionlint
        run: actionlint
