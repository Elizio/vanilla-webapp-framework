name: CI

on:
  workflow_call:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop, master]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      APP_PROFILE: testing
      FLASK_SECRET: test-flask-secret-key
      JWT_SECRET: test-jwt-secret-key
      DATABASE_URI: "sqlite:///:memory:"
      PROJECT_FOLDER: /tmp/vanilla-webapp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install -e . --no-deps
      - name: Verify pinned versions match requirements.txt
        run: python scripts/check_pins.py
      - name: Run pip-audit on runtime dependencies
        run: pip-audit -r requirements.txt
      - name: Lint and typecheck Python
        run: make lint-python
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - name: Run npm audit on production dependencies
        run: cd frontend && npm audit --omit=dev --audit-level=high
      - name: Lint frontend JS and JSON
        run: make lint-frontend
      - run: cd frontend && npm run build
      - run: test -f backend/static/index.html
      - run: cd frontend && npm run test:coverage

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history so `gitleaks detect` scans every commit, not just the
          # PR tip (default fetch-depth: 1).
          fetch-depth: 0
      - name: Install pinned shellcheck, actionlint, and gitleaks
        run: ./scripts/install-lint-tools.sh
      - name: Run shellcheck, actionlint, and gitleaks
        run: make lint-shell
