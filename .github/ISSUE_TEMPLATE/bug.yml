name: Bug
description: Something is broken
labels: ["bug"]
body:
  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: What should happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: What happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduce
      description: Commands, URLs, or steps.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Commit SHA, image tag, or `make check` date.
