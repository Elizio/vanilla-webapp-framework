name: Feature
description: A new capability or change
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who is stuck and what is missing?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change? Point at files when you can.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: How will we know it is done?
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime change?
      options:
        - Tooling / docs only
        - App runtime (deploys on merge)
        - Unsure
    validations:
      required: true
